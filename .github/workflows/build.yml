name: Build PC Aimbot
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Download and Extract OpenCV (Fast)
      run: |
        Invoke-WebRequest -Uri "https://github.com/opencv/opencv/releases/download/4.8.0/opencv-4.8.0-windows.exe" -OutFile "opencv.exe"
        Start-Process -FilePath ".\opencv.exe" -ArgumentList "-o`"C:\OpenCV`" -y" -Wait
        
    - name: Configure CMake
      run: cmake -B build -S . -DOpenCV_DIR="C:/OpenCV/opencv/build"
      
    - name: Build App
      run: cmake --build build --config Release
      
    - name: Download AI Model
      run: |
        curl.exe -L -o build/Release/yolov8n.onnx "https://huggingface.co/Ultralytics/YOLOv8/resolve/main/yolov8n.onnx"
        
    - name: Copy OpenCV DLL
      run: |
        copy C:\OpenCV\opencv\build\x64\vc16\bin\opencv_world480.dll build\Release\
        
    - name: Upload Final Package
      uses: actions/upload-artifact@v4
      with:
        name: PC-Aimbot-Final
        path: build/Release/
